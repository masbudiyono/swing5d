name: Swing5D Daily Scanner & Deploy

on:
  schedule:
    # Eksekusi Senin-Jumat jam 16:15 WIB (09:15 UTC) pasca penutupan IHSG
    - cron: '15 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pandas yfinance

      - name: Run Screener Engine
        run: python screener.py

      - name: Commit & Push updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/screener.json
          git diff --staged --quiet || (git commit -m "Auto-update screener data [skip ci]" && git push)
